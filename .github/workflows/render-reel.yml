name: Render Reel

# Trigger manually from GitHub mobile app or web:
#   Repo → Actions tab → "Render Reel" → "Run workflow"
# Pick the project slug + quality, hit the button, wait ~2 minutes, download the MP4 artifact.

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project folder under video-projects/ (e.g. kingston-reel-01)"
        required: true
        default: "kingston-reel-01"
        type: string
      quality:
        description: "Render quality"
        required: true
        default: "draft"
        type: choice
        options:
          - draft
          - standard
          - high
      workers:
        description: "Parallel workers (1–4; keep low if timeouts happen)"
        required: false
        default: "2"
        type: string

concurrency:
  group: render-${{ github.event.inputs.project }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install workspace deps
        run: npm install

      - name: Install FFmpeg + Chrome runtime libs
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libcairo2

      - name: Lint composition
        working-directory: video-projects/${{ github.event.inputs.project }}
        run: npx hyperframes lint

      - name: Render
        working-directory: video-projects/${{ github.event.inputs.project }}
        run: |
          mkdir -p renders
          npx hyperframes render \
            --quality ${{ github.event.inputs.quality }} \
            --workers ${{ github.event.inputs.workers }} \
            --output renders/${{ github.event.inputs.project }}-${{ github.event.inputs.quality }}.mp4

      - name: Frame sanity-check (5 stills)
        working-directory: video-projects/${{ github.event.inputs.project }}
        run: |
          mkdir -p renders/frames
          MP4=renders/${{ github.event.inputs.project }}-${{ github.event.inputs.quality }}.mp4
          DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$MP4")
          echo "Duration: $DUR"
          for pct in 10 30 50 70 90; do
            t=$(awk "BEGIN { printf \"%.2f\", $DUR * $pct / 100 }")
            ffmpeg -y -ss "$t" -i "$MP4" -frames:v 1 -q:v 2 "renders/frames/t${pct}pct.png" -loglevel error
          done
          ls -la renders/frames

      - name: Upload MP4 + stills
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.project }}-${{ github.event.inputs.quality }}-${{ github.run_number }}
          path: |
            video-projects/${{ github.event.inputs.project }}/renders/${{ github.event.inputs.project }}-${{ github.event.inputs.quality }}.mp4
            video-projects/${{ github.event.inputs.project }}/renders/frames/*.png
          retention-days: 14
          if-no-files-found: error
