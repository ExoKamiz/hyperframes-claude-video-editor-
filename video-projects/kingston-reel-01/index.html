<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Kingston Reel 01 — Convoluted Foam</title>
<link rel="stylesheet" href="assets/brand-tokens.css" />
<script src="assets/gsap.min.js"></script>
<style>
  @font-face { font-family: "Cormorant Garamond"; font-style: normal; font-weight: 400; src: url("assets/fonts/cormorant-400.woff2") format("woff2"); font-display: block; }
  @font-face { font-family: "Cormorant Garamond"; font-style: normal; font-weight: 600; src: url("assets/fonts/cormorant-600.woff2") format("woff2"); font-display: block; }
  @font-face { font-family: "Cormorant Garamond"; font-style: italic; font-weight: 600; src: url("assets/fonts/cormorant-600-italic.woff2") format("woff2"); font-display: block; }
  @font-face { font-family: "Montserrat"; font-style: normal; font-weight: 400; src: url("assets/fonts/montserrat-400.woff2") format("woff2"); font-display: block; }
  @font-face { font-family: "Montserrat"; font-style: normal; font-weight: 500; src: url("assets/fonts/montserrat-500.woff2") format("woff2"); font-display: block; }
  @font-face { font-family: "Montserrat"; font-style: normal; font-weight: 600; src: url("assets/fonts/montserrat-600.woff2") format("woff2"); font-display: block; }
  @font-face { font-family: "Montserrat"; font-style: normal; font-weight: 700; src: url("assets/fonts/montserrat-700.woff2") format("woff2"); font-display: block; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }

  #root {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: #000;
    overflow: hidden;
    font-family: var(--font-body);
    color: var(--kf-text);
  }

  /* ─── FACE VIDEO — fills full 1920x1080 canvas, native phone framing ─── */
  .face-wrap {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
  }
  .face-wrap video {
    width: 100%; height: 100%;
    display: block;
    object-fit: cover;
  }

  /* ─── PAYOFF POP-UP (bottom-right corner on the phrase "convoluted foam") ─── */
  .payoff {
    position: absolute;
    right: 80px; bottom: 80px;
    padding: 32px 44px;
    background: rgba(15,15,15,0.88);
    border: 1.5px solid var(--kf-gold);
    backdrop-filter: blur(8px);
    text-align: left;
    max-width: 640px;
    opacity: 0;
    box-shadow: 0 8px 40px rgba(0,0,0,0.45);
  }
  .payoff .label {
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 18px;
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: var(--kf-gold);
    margin-bottom: 12px;
  }
  .payoff .phrase {
    font-family: var(--font-display);
    font-weight: 600;
    font-style: italic;
    font-size: 64px;
    line-height: 1;
    color: var(--kf-text);
  }

  /* ─── OUTRO ─── */
  .outro {
    position: absolute;
    inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 40px;
    padding: 0 120px;
    opacity: 0;
    background: radial-gradient(ellipse at 50% 45%, #2a2017 0%, var(--kf-bg-warm) 75%);
  }
  .outro .logo { width: 580px; height: auto; }
  .outro .lead {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 76px;
    text-align: center;
    line-height: 1.05;
    color: var(--kf-text);
  }
  .outro .lead em { color: var(--kf-gold); font-style: italic; }
  .outro .sub {
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 24px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--kf-text-dim);
  }
  .outro .cta {
    display: inline-block;
    padding: 18px 40px;
    border: 1px solid var(--kf-gold);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 24px;
    letter-spacing: 0.04em;
    color: var(--kf-text);
  }
  .outro .cta .arrow { color: var(--kf-gold); margin-left: 14px; }
  .outro .domain {
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 0.04em;
    color: var(--kf-text-dim);
  }
</style>
</head>
<body>

<div id="root"
     data-composition-id="kingston-reel-01"
     data-start="0"
     data-duration="11"
     data-width="1920"
     data-height="1080">

  <!-- single audio source (video is video-only, no baked-in track) -->
  <audio id="face-audio" src="assets/clip-audio.m4a"
         data-start="0" data-duration="7.1"
         data-track-index="9"></audio>

  <!-- FULL-SIZE FACE VIDEO (fills entire canvas 0 -> 7.1s) -->
  <div class="face-wrap clip" id="face"
       data-start="0" data-duration="7.1" data-track-index="0">
    <video src="assets/clip.mp4" muted playsinline></video>
  </div>

  <!-- PAYOFF POP-UP — lands with "convoluted foam" (5.4 -> 7.1s internal, at ~5.4s master) -->
  <div class="payoff clip" id="payoff"
       data-start="5.4" data-duration="1.7" data-track-index="2">
    <div class="label">The answer</div>
    <div class="phrase">Convoluted Foam</div>
  </div>

  <!-- OUTRO 7.1 -> 11s -->
  <div class="outro clip" id="outro"
       data-start="7.1" data-duration="3.9" data-track-index="3">
    <div class="lead">Art shipping,<br/><em>done right.</em></div>
    <img class="logo" src="assets/Kingston_Logo.svg" alt="Kingston Frameworks" />
    <div class="sub">Art Shipping &amp; Packaging</div>
    <div class="cta">Book a consult <span class="arrow">→</span></div>
    <div class="domain">kingstonframeworks.ca</div>
  </div>

</div>

<script>
(function () {
  const tl = gsap.timeline({ paused: true });

  // VIDEO: fade-in over 0.3s, full-opacity through 7.1s
  tl.fromTo("#face", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "sine.out" }, 0);
  tl.to("#face", { opacity: 0, duration: 0.5, ease: "sine.in" }, 6.9);

  // PAYOFF POP-UP
  tl.fromTo("#payoff",
    { opacity: 0, y: 24, scale: 0.96 },
    { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "expo.out" }, 5.4);
  tl.to("#payoff", { opacity: 0, duration: 0.3, ease: "sine.in" }, 6.9);

  // OUTRO
  tl.to("#outro", { opacity: 1, duration: 0.4, ease: "sine.out" }, 7.1);
  tl.fromTo("#outro .lead", { opacity: 0, y: 20 },
    { opacity: 1, y: 0, duration: 0.9, ease: "expo.out" }, 7.3);
  tl.fromTo("#outro .logo", { opacity: 0, y: 20 },
    { opacity: 1, y: 0, duration: 0.8, ease: "expo.out" }, 7.7);
  tl.fromTo("#outro .sub", { opacity: 0, y: 10 },
    { opacity: 1, y: 0, duration: 0.6, ease: "sine.out" }, 8.1);
  tl.fromTo("#outro .cta", { opacity: 0, y: 10 },
    { opacity: 1, y: 0, duration: 0.6, ease: "sine.out" }, 8.4);
  tl.fromTo("#outro .domain", { opacity: 0 },
    { opacity: 1, duration: 0.6, ease: "sine.out" }, 8.7);

  // hold tail
  tl.set({}, {}, 11.0);

  window.__timelines = window.__timelines || {};
  window.__timelines["kingston-reel-01"] = tl;
})();
</script>

</body>
</html>
