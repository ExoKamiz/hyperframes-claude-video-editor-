<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Kingston Reel 01 — Convoluted Foam</title>
<link rel="stylesheet" href="assets/brand-tokens.css" />
<script src="assets/gsap.min.js"></script>
<style>
  @font-face { font-family: "Cormorant Garamond"; font-style: normal; font-weight: 400; src: url("assets/fonts/cormorant-400.woff2") format("woff2"); font-display: block; }
  @font-face { font-family: "Cormorant Garamond"; font-style: normal; font-weight: 600; src: url("assets/fonts/cormorant-600.woff2") format("woff2"); font-display: block; }
  @font-face { font-family: "Cormorant Garamond"; font-style: italic; font-weight: 600; src: url("assets/fonts/cormorant-600-italic.woff2") format("woff2"); font-display: block; }
  @font-face { font-family: "Montserrat"; font-style: normal; font-weight: 400; src: url("assets/fonts/montserrat-400.woff2") format("woff2"); font-display: block; }
  @font-face { font-family: "Montserrat"; font-style: normal; font-weight: 500; src: url("assets/fonts/montserrat-500.woff2") format("woff2"); font-display: block; }
  @font-face { font-family: "Montserrat"; font-style: normal; font-weight: 600; src: url("assets/fonts/montserrat-600.woff2") format("woff2"); font-display: block; }
  @font-face { font-family: "Montserrat"; font-style: normal; font-weight: 700; src: url("assets/fonts/montserrat-700.woff2") format("woff2"); font-display: block; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }

  #root {
    position: relative;
    width: 1080px;
    height: 1920px;
    background: var(--kf-bg-warm);
    overflow: hidden;
    font-family: var(--font-body);
    color: var(--kf-text);
  }

  /* ambient vignette always-on */
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(0,0,0,0.65) 100%);
    pointer-events: none; z-index: 20;
  }

  /* subtle grain */
  .grain {
    position: absolute; inset: 0; z-index: 21; opacity: 0.08; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* ─── HOOK (0 – 2s) ─────────────────────────── */
  .hook {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 920px;
    text-align: center;
    opacity: 0;
  }
  .hook .kicker {
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 28px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--kf-gold);
    margin-bottom: 40px;
  }
  .hook h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 96px;
    line-height: 1.1;
    color: var(--kf-text);
  }
  .hook .gold { color: var(--kf-gold); font-style: italic; }

  /* ─── FACE VIDEO (2 – 9.1s) ────────────────── */
  .face-wrap {
    position: absolute;
    left: 0;
    top: 180px;
    width: 1080px;
    height: 608px;
    overflow: hidden;
    opacity: 0;
  }
  .face-wrap video {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .face-frame {
    position: absolute;
    left: 40px; top: 160px;
    width: 1000px; height: 648px;
    border: 1.5px solid var(--kf-gold);
    opacity: 0;
    pointer-events: none;
  }

  /* ─── KARAOKE CAPTIONS ─────────────────────── */
  .captions {
    position: absolute;
    left: 60px; right: 60px;
    top: 880px;
    text-align: center;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 58px;
    line-height: 1.3;
    letter-spacing: -0.005em;
    color: var(--kf-text-dim);
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    opacity: 0;
  }
  .captions .w {
    display: inline-block;
    margin: 0 8px;
    transition: color 60ms linear;
  }
  .captions .w.active { color: var(--kf-text); }
  .captions .w.gold.active { color: var(--kf-gold); }

  /* ─── PAYOFF POP-UP ────────────────────────── */
  .payoff {
    position: absolute;
    left: 50%;
    top: 1280px;
    transform: translateX(-50%);
    width: 900px;
    padding: 48px 56px;
    background: rgba(26,22,18,0.92);
    border: 1.5px solid var(--kf-gold);
    text-align: center;
    opacity: 0;
  }
  .payoff .label {
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: var(--kf-gold);
    margin-bottom: 18px;
  }
  .payoff .phrase {
    font-family: var(--font-display);
    font-weight: 600;
    font-style: italic;
    font-size: 80px;
    line-height: 1;
    color: var(--kf-text);
  }

  /* ─── OUTRO (9.1 – 13s) ────────────────────── */
  .outro {
    position: absolute;
    inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 56px;
    padding: 0 80px;
    opacity: 0;
    background: radial-gradient(ellipse at 50% 40%, #2a2017 0%, var(--kf-bg-warm) 70%);
  }
  .outro .logo { width: 720px; height: auto; }
  .outro .lead {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 92px;
    text-align: center;
    line-height: 1.05;
    color: var(--kf-text);
  }
  .outro .lead em { color: var(--kf-gold); font-style: italic; }
  .outro .sub {
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 32px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--kf-text-dim);
    text-align: center;
  }
  .outro .cta {
    display: inline-block;
    margin-top: 24px;
    padding: 22px 48px;
    border: 1px solid var(--kf-gold);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 28px;
    letter-spacing: 0.04em;
    color: var(--kf-text);
  }
  .outro .cta .arrow { color: var(--kf-gold); margin-left: 16px; }
  .outro .domain {
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 26px;
    letter-spacing: 0.04em;
    color: var(--kf-text-dim);
  }

  /* subtle corner glow during video section */
  .side-glow {
    position: absolute; z-index: 5;
    pointer-events: none;
    opacity: 0;
  }
  .side-glow.tl { top: 120px; left: -100px; width: 500px; height: 500px;
    background: radial-gradient(circle, var(--kf-gold-glow) 0%, rgba(0,0,0,0) 60%); }
</style>
</head>
<body>

<div id="root"
     data-composition-id="kingston-reel-01"
     data-start="0"
     data-duration="13"
     data-width="1080"
     data-height="1920">

  <!-- audio (master mixer) -->
  <audio id="face-audio" src="assets/clip-audio.m4a"
         data-start="2" data-duration="7.1"
         data-track-index="9"></audio>

  <!-- ─────── HOOK ─────── -->
  <div class="clip hook" id="hook"
       data-start="0" data-duration="2" data-track-index="1">
    <div class="kicker">Kingston Frameworks</div>
    <h1>Shipping <span class="gold">fragile</span> art to a gallery?</h1>
  </div>

  <!-- ─────── FACE VIDEO ─────── -->
  <div class="face-wrap clip" id="face"
       data-start="2" data-duration="7.1" data-track-index="0">
    <video src="assets/clip.mp4" muted playsinline></video>
  </div>
  <div class="face-frame clip" id="face-frame"
       data-start="2" data-duration="7.1" data-track-index="5"></div>

  <!-- side glow during video -->
  <div class="side-glow tl clip"
       data-start="2" data-duration="7.1" data-track-index="4"></div>

  <!-- ─────── KARAOKE CAPTIONS ─────── -->
  <!-- Segment A: 2.54 – 6.41 (master time) -->
  <div class="captions clip" id="capA"
       data-start="2.54" data-duration="3.95" data-track-index="2">
    <span class="w" data-t="0.00">When</span>
    <span class="w" data-t="0.28">you</span>
    <span class="w" data-t="0.48">have</span>
    <span class="w" data-t="0.76">a</span>
    <span class="w gold" data-t="0.83">convoluted</span>
    <span class="w" data-t="1.52">situation</span>
    <span class="w" data-t="2.14">to</span>
    <span class="w" data-t="2.28">get</span>
    <span class="w" data-t="2.49">your</span>
    <span class="w" data-t="2.76">pieces</span>
    <span class="w" data-t="3.18">to</span>
    <span class="w" data-t="3.32">a</span>
    <span class="w" data-t="3.39">gallery</span>
  </div>

  <!-- Segment B: 6.96 – 7.86 (master time) — the payoff line -->
  <div class="captions clip" id="capB"
       data-start="6.96" data-duration="1.4" data-track-index="2">
    <span class="w" data-t="0.00">what</span>
    <span class="w" data-t="0.13">you</span>
    <span class="w" data-t="0.23">need</span>
    <span class="w" data-t="0.37">is</span>
    <span class="w gold" data-t="0.43">convoluted</span>
    <span class="w gold" data-t="0.76">foam</span>
  </div>

  <!-- ─────── PAYOFF POP-UP (lands with "convoluted foam") ─────── -->
  <div class="payoff clip" id="payoff"
       data-start="7.4" data-duration="1.7" data-track-index="3">
    <div class="label">The answer</div>
    <div class="phrase">Convoluted Foam</div>
  </div>

  <!-- ─────── OUTRO ─────── -->
  <div class="outro clip" id="outro"
       data-start="9.1" data-duration="3.9" data-track-index="6">
    <div class="lead">Art shipping,<br/><em>done right.</em></div>
    <img class="logo" src="assets/Kingston_Logo.svg" alt="Kingston Frameworks" />
    <div class="sub">Art Shipping &amp; Packaging</div>
    <div class="cta">Book a consult <span class="arrow">→</span></div>
    <div class="domain">kingstonframeworks.ca</div>
  </div>

  <!-- ambient layers (on top of video/captions but below payoff) -->
  <div class="vignette"></div>
  <div class="grain"></div>

</div>

<script>
(function () {
  const tl = gsap.timeline({ paused: true });

  // HOOK 0 → 2s
  tl.fromTo("#hook", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "expo.out" }, 0.2);
  tl.to("#hook", { opacity: 0, y: -20, duration: 0.4, ease: "power2.in" }, 1.6);

  // VIDEO 2 → 9.1s
  tl.to("#face", { opacity: 1, duration: 0.5, ease: "sine.out" }, 1.9);
  tl.to("#face-frame", { opacity: 0.5, duration: 0.8, ease: "sine.out" }, 2.0);
  tl.to(".side-glow.tl", { opacity: 0.7, duration: 1.2, ease: "sine.inOut" }, 2.1);

  // CAPTIONS fade in/out wrappers
  tl.to("#capA", { opacity: 1, duration: 0.3, ease: "sine.out" }, 2.5);
  tl.to("#capA", { opacity: 0, duration: 0.3, ease: "sine.in" }, 6.4);
  tl.to("#capB", { opacity: 1, duration: 0.3, ease: "sine.out" }, 6.9);
  tl.to("#capB", { opacity: 0, duration: 0.3, ease: "sine.in" }, 8.3);

  // KARAOKE word-by-word highlight — relative to each segment's data-start
  const activate = (sel, offset) => {
    document.querySelectorAll(sel + " .w").forEach(w => {
      const t = offset + parseFloat(w.dataset.t);
      tl.to(w, { duration: 0.01, onStart: () => w.classList.add("active") }, t);
    });
  };
  activate("#capA", 2.54);
  activate("#capB", 6.96);

  // PAYOFF pop-up — lands with "convoluted foam" word
  tl.fromTo("#payoff",
    { opacity: 0, y: 40, scale: 0.94 },
    { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "expo.out" }, 7.4);
  tl.to("#payoff", { opacity: 0, duration: 0.3, ease: "sine.in" }, 8.8);

  // FACE video exit
  tl.to("#face, #face-frame, .side-glow.tl", { opacity: 0, duration: 0.5, ease: "sine.in" }, 8.7);

  // OUTRO 9.1 → 13s
  tl.fromTo("#outro .lead", { opacity: 0, y: 20 },
    { opacity: 1, y: 0, duration: 0.9, ease: "expo.out" }, 9.3);
  tl.fromTo("#outro .logo", { opacity: 0, y: 20 },
    { opacity: 1, y: 0, duration: 0.8, ease: "expo.out" }, 9.7);
  tl.fromTo("#outro .sub", { opacity: 0, y: 10 },
    { opacity: 1, y: 0, duration: 0.6, ease: "sine.out" }, 10.2);
  tl.fromTo("#outro .cta", { opacity: 0, y: 10 },
    { opacity: 1, y: 0, duration: 0.6, ease: "sine.out" }, 10.5);
  tl.fromTo("#outro .domain", { opacity: 0 },
    { opacity: 1, duration: 0.6, ease: "sine.out" }, 10.8);
  // Outro container itself
  tl.to("#outro", { opacity: 1, duration: 0.4, ease: "sine.out" }, 9.1);

  // Hold tail for ~2s so the CTA sits
  tl.set({}, {}, 13.0);

  window.__timelines = window.__timelines || {};
  window.__timelines["kingston-reel-01"] = tl;
})();
</script>

</body>
</html>
